services:
  - type: web
    name: zh-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: zh-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-frontend.vercel.app"   # we will update this later

databases:
  - name: zh-db
    plan: free
